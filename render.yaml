# render.yaml
services:
  - type: web
    name: gestion-transport-app-web
    env: python
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn transport_app.wsgi:application
    envVars:
      - key: DATABASE_URL
        value: postgresql://bayrem:zsElQfqNUYEkc9LfABdhmy5KOQMCdtUS@dpg-d61357a4d50c738fik40-a.oregon-postgres.render.com/gestion_transport_9841
        fromDatabase:
          name: gestion-transport-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # Pas besoin de DISABLE_COLLECTSTATIC avec WhiteNoise
    autoDeploy: true

  - type: pg
    name: gestion-transport-db
    plan: free
    databaseName: gestion_transport
    user: bayern
    region: oregon  # Choisissez la même région que votre web service