# render.yaml
services:
  - type: web
    name: gestion-transport-app-web
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn transport_app.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestion-transport-db  # Nom de votre DB sur Render
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DISABLE_COLLECTSTATIC
        value: "1"
    autoDeploy: true

  - type: pg
    name: gestion-transport-db
    plan: free
    ipAllowList: []